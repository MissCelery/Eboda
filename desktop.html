<title>Eboda</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<style>
/* Layout: one-screen app. Tabs on top, a view toolbar, a tool row, a properties row when something is selected, then sidebar + page strip. Quiet UI so the document is the loudest thing on screen. */
:root{
  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f6f7fa; --line:#d9dde5; --fg:#1b2130; --muted:#5e6778;
  --accent:#2457c5; --accent-fg:#ffffff; --accent-soft:#dce6fb; --hl:rgba(255,196,0,.45); --hl-cur:rgba(255,120,0,.65);
  --danger:#c0392b; --field:rgba(36,87,197,.10);
  --page-shadow:0 1px 2px rgba(20,30,50,.12),0 8px 24px rgba(20,30,50,.10);
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Instrument Serif",Georgia,serif; --script:"Caveat","Segoe Script","Bradley Hand",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181d; --panel:#1e2229; --panel-2:#242931; --line:#343a45; --fg:#e8ebf0; --muted:#9aa3b2;
  --accent:#6f9cff; --accent-fg:#0f172a; --accent-soft:#263656; --hl:rgba(255,196,0,.4); --hl-cur:rgba(255,130,0,.65); --danger:#ff7b6b; --field:rgba(111,156,255,.14);
  --page-shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181d; --panel:#1e2229; --panel-2:#242931; --line:#343a45; --fg:#e8ebf0; --muted:#9aa3b2;
  --accent:#6f9cff; --accent-fg:#0f172a; --accent-soft:#263656; --hl:rgba(255,196,0,.4); --hl-cur:rgba(255,130,0,.65); --danger:#ff7b6b; --field:rgba(111,156,255,.14);
  --page-shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:6px;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{display:flex;flex-direction:column;height:100%}

/* Top bar */
.top{display:flex;align-items:stretch;gap:8px;height:42px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 10px 0 12px;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:21px;letter-spacing:.01em;padding-right:8px;border-right:1px solid var(--line);margin-right:2px}
.brand .mark{width:18px;height:22px;border:2px solid var(--accent);border-radius:2px 7px 2px 2px;position:relative}
.brand .mark::after{content:"";position:absolute;right:-2px;top:-2px;width:8px;height:8px;background:var(--panel);border-left:2px solid var(--accent);border-bottom:2px solid var(--accent)}
.tabs{display:flex;align-items:flex-end;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;gap:2px;padding-top:6px}
.tab{display:flex;align-items:center;gap:6px;max-width:220px;min-width:90px;height:34px;padding:0 6px 0 12px;border-radius:8px 8px 0 0;color:var(--muted);border:1px solid transparent;border-bottom:0;flex:none;cursor:default;user-select:none}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.tab.active{background:var(--bg);color:var(--fg);border-color:var(--line);position:relative;top:1px}
.tab .x{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--muted);flex:none}
.tab .x:hover{background:var(--line);color:var(--fg)}
.top .actions{display:flex;align-items:center;gap:4px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:6px;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default}
.ib{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:6px;color:var(--fg);flex:none}
.ib:hover{background:var(--panel-2)}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default;background:none}
.ib svg,.btn svg,.tool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tool{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:6px;color:var(--fg);white-space:nowrap;position:relative}
.tool svg{width:17px;height:17px}
.tool:hover{background:var(--panel-2)}
.tool.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.tool:disabled,.tool[aria-disabled="true"]{opacity:.35;cursor:default;background:none;pointer-events:none}
.tool{cursor:pointer;user-select:none}
.tool .sw{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.2)}

/* Toolbars */
.bar{display:flex;align-items:center;gap:4px;height:40px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 8px;flex:none;overflow-x:auto;scrollbar-width:none}
.bar .sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.bar .grow{flex:1}
.bar.tools{height:38px;background:var(--panel)}
.pageno{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;color:var(--muted)}
.pageno input{width:46px;height:28px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);font-variant-numeric:tabular-nums}
.zoomsel,.propbar select,.propbar input[type=number]{height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:0 6px;font-variant-numeric:tabular-nums}
.filename{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;max-width:40vw}
.propbar{display:flex;align-items:center;gap:6px;height:38px;background:var(--panel-2);border-bottom:1px solid var(--line);padding:0 10px;flex:none;overflow-x:auto;scrollbar-width:none;font-size:13px}
.propbar[hidden]{display:none}
.propbar label{color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.propbar input[type=number]{width:62px}
.propbar input[type=color]{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px;cursor:pointer}
.propbar input[type=range]{width:90px}
.propbar .ib{width:28px;height:28px;font-weight:600}
.propbar .hint{color:var(--muted);margin-left:auto;white-space:nowrap}
.propbar .del{color:var(--danger)}
.menu{position:absolute;top:34px;left:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--page-shadow);padding:4px;display:flex;flex-direction:column;gap:2px;z-index:40;min-width:150px}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:5px;text-align:left;white-space:nowrap;color:var(--fg)}
.menu button:hover{background:var(--panel-2)}
.menu button.on{background:var(--accent-soft);color:var(--accent)}

/* Body */
.main{display:flex;flex:1;min-height:0;position:relative}
.side{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side[hidden]{display:none}
.side .seg{display:flex;padding:8px;gap:4px;border-bottom:1px solid var(--line)}
.side .seg button{flex:1;height:28px;border-radius:6px;color:var(--muted);font-weight:500}
.side .seg button.on{background:var(--accent-soft);color:var(--accent)}
.side .pane{flex:1;overflow:auto;min-height:0;padding:10px}
.pageops{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line)}
.pageops .ib{width:28px;height:28px}
.pageops .ib svg{width:16px;height:16px}
.pageops .n{font-size:12px;color:var(--muted);align-self:center;margin-left:auto;padding-right:4px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:12px;cursor:pointer;position:relative;border-radius:6px;padding:4px}
.thumb .frame{width:150px;background:var(--panel-2);box-shadow:var(--page-shadow);border:2px solid transparent;border-radius:2px;display:grid;place-items:center;overflow:hidden}
.thumb.cur .frame{border-color:var(--accent)}
.thumb.picked{background:var(--accent-soft)}
.thumb canvas{display:block;max-width:100%}
.thumb .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb.dropbefore::before,.thumb.dropafter::after{content:"";position:absolute;left:8px;right:8px;height:3px;background:var(--accent);border-radius:2px}
.thumb.dropbefore::before{top:-7px}
.thumb.dropafter::after{bottom:-7px}
.thumb.dragging{opacity:.4}
.ol{list-style:none;margin:0;padding:0}
.ol .row{display:flex;align-items:flex-start;gap:2px;padding:4px 4px 4px 0;border-radius:5px;cursor:pointer;font-size:13px;line-height:1.3}
.ol .row:hover{background:var(--panel-2)}
.ol .tw{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--muted);transition:transform .15s}
.ol .tw.open{transform:rotate(90deg)}
.ol .tw.none{visibility:hidden}
.ol ul{list-style:none;margin:0;padding-left:14px}
.ol ul[hidden]{display:none}
.empty-note{color:var(--muted);font-size:13px;padding:8px 4px}
.cmt{display:flex;gap:8px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.cmt:hover{background:var(--panel-2)}
.cmt.cur{border-color:var(--accent)}
.cmt .sw{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.cmt .b{min-width:0;font-size:13px}
.cmt .b .t{color:var(--muted);font-size:11px}
.cmt .b .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.viewer{flex:1;min-width:0;overflow:auto;position:relative;scroll-behavior:auto}
.strip{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 16px 60px}
.strip[hidden]{display:none}
.page{position:relative;background:#fff;box-shadow:var(--page-shadow);flex:none;overflow:visible;--scale-round-x:1px;--scale-round-y:1px}
.page canvas{display:block;position:absolute;inset:0}
.page.loading::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 14px,rgba(0,0,0,.02) 14px 15px)}
.night .page{background:#1a1d22}
.night .page canvas,.night .thumb canvas{filter:invert(.92) hue-rotate(180deg)}
.hl-layer{position:absolute;inset:0;pointer-events:none}
.hl-layer div{position:absolute;background:var(--hl);border-radius:2px;mix-blend-mode:multiply}
.hl-layer div.cur{background:var(--hl-cur)}
.night .hl-layer div{mix-blend-mode:screen}

/* pdf.js text layer (inlined; the CDN stylesheet is blocked) */
.textLayer{position:absolute;inset:0;overflow:clip;opacity:1;line-height:1;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;caret-color:CanvasText;z-index:2}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer > :not(.markedContent),.textLayer .markedContent span:not(.markedContent){z-index:1}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.textLayer ::selection{background:rgba(36,87,197,.35)}
.textLayer[data-main-rotation="90"]{transform:rotate(90deg) translateY(-100%)}
.textLayer[data-main-rotation="180"]{transform:rotate(180deg) translate(-100%,-100%)}
.textLayer[data-main-rotation="270"]{transform:rotate(270deg) translateX(-100%)}
.viewer:not(.tool-select):not(.tool-highlight):not(.tool-underline):not(.tool-strike) .textLayer{pointer-events:none}
.tool-highlight .textLayer ::selection{background:rgba(255,226,52,.6)}
.tool-underline .textLayer ::selection,.tool-strike .textLayer ::selection{background:rgba(224,49,49,.35)}
.tool-text .page,.tool-note .page{cursor:text}
.tool-edit .page{cursor:pointer}
.tool-place .page{cursor:copy}
.tool-pen .page,.tool-rect .page,.tool-ellipse .page,.tool-line .page,.tool-arrow .page,.tool-redact .page{cursor:crosshair}

/* Form fields */
.form-layer{position:absolute;inset:0;z-index:3;pointer-events:none}
.form-layer .fld{position:absolute;pointer-events:auto;background:var(--field);border:1px solid rgba(36,87,197,.25);border-radius:2px;margin:0;padding:0 3px;font:inherit;color:#111;min-width:0}
.form-layer .fld:focus{outline:2px solid var(--accent);outline-offset:0;background:rgba(255,255,255,.9)}
.form-layer textarea.fld{resize:none;line-height:1.25;padding:2px 3px}
.form-layer select.fld{padding:0 2px}
.form-layer input[type=checkbox].fld,.form-layer input[type=radio].fld{appearance:none;cursor:pointer;display:grid;place-items:center}
.form-layer input[type=checkbox].fld::after{content:"";width:60%;height:60%;background:#111;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0,43% 62%);display:none}
.form-layer input[type=checkbox].fld:checked::after{display:block}
.form-layer input[type=radio].fld{border-radius:50%}
.form-layer input[type=radio].fld::after{content:"";width:50%;height:50%;border-radius:50%;background:#111;display:none}
.form-layer input[type=radio].fld:checked::after{display:block}
.viewer:not(.tool-select) .form-layer{pointer-events:none}
.viewer:not(.tool-select) .form-layer .fld{pointer-events:none}
.night .form-layer .fld{color:#eee;background:rgba(111,156,255,.18)}

/* Edit overlays */
.ov-layer{position:absolute;inset:0;z-index:4;pointer-events:none}
.ov{position:absolute;pointer-events:auto;transform-origin:0 0}
.ov .cover{position:absolute;inset:0}
.ov .box{position:absolute;inset:0;border:1px dashed transparent;border-radius:2px}
.tool-select .ov:hover .box,.tool-edit .ov:hover .box{border-color:rgba(36,87,197,.45)}
.ov.sel .box{border:1.5px solid var(--accent)}
.ov textarea{position:absolute;left:0;top:0;margin:0;padding:0;border:0;background:transparent;resize:none;overflow:hidden;white-space:pre;outline:none;line-height:1.2;min-width:8px;display:block;cursor:text;pointer-events:none}
.ov.editing textarea{pointer-events:auto}
.ov textarea::placeholder{color:rgba(36,87,197,.45)}
.ov.dragging{cursor:move}
.ov.sel .hnd{position:absolute;right:-7px;bottom:-7px;width:12px;height:12px;background:var(--panel);border:1.5px solid var(--accent);border-radius:3px;cursor:nwse-resize}
.ov img{display:block;width:100%;height:100%;pointer-events:none;user-select:none}
.ov.img-ov{cursor:move}
.ov.text-ov.sel{cursor:move}
.ov.text-ov.editing{cursor:text}
.night .ov img,.night .ov .cover{filter:invert(.92) hue-rotate(180deg)}
/* vector annotations live in one SVG per page, drawn in view space */
.anno{position:absolute;left:0;top:0;z-index:3;overflow:visible;transform-origin:0 0;pointer-events:none}
.anno .a{pointer-events:auto;cursor:move}
.anno .a.mark{mix-blend-mode:multiply}
.night .anno .a.mark{mix-blend-mode:screen}
.anno .a.sel{filter:drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 1px var(--accent))}
.anno .hit{stroke:transparent;fill:none;pointer-events:stroke}
.anno .hitf{stroke:none;fill:transparent;pointer-events:fill}
.anno .live{pointer-events:none}
.anno .redact rect{fill:#111;stroke:#e03131;stroke-width:1;stroke-dasharray:4 3;fill-opacity:.85}
.viewer:not(.tool-select) .anno .a{pointer-events:none}
/* sticky notes */
.note{position:absolute;width:22px;height:22px;pointer-events:auto;cursor:move;z-index:5;transform-origin:0 0}
.note svg{width:22px;height:22px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.note.sel svg{outline:2px solid var(--accent);border-radius:4px}
.note .pop{position:absolute;left:26px;top:0;width:220px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:var(--page-shadow);padding:8px;display:none;cursor:default;z-index:6}
.note.open .pop{display:block}
.note .pop textarea{width:100%;height:84px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:6px;resize:vertical;font-size:13px;line-height:1.3;white-space:pre-wrap;pointer-events:auto}
.note .pop .who{font-size:11px;color:var(--muted);margin-bottom:4px}
.viewer:not(.tool-select) .note{pointer-events:none}

/* Empty state */
.welcome{position:absolute;inset:0;display:grid;place-items:center;padding:24px}
.welcome[hidden]{display:none}
.welcome .card{max-width:420px;text-align:center}
.welcome h1{font-family:var(--serif);font-weight:400;font-size:40px;margin:0 0 6px;text-wrap:balance}
.welcome p{color:var(--muted);margin:0 0 18px}
.welcome .drop{border:1.5px dashed var(--line);border-radius:12px;padding:28px 20px;color:var(--muted);margin-top:14px}

/* Search */
.find{position:absolute;top:10px;right:24px;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:var(--page-shadow);z-index:7}
.find[hidden]{display:none}
.find input{width:220px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:0 8px}
.find .count{color:var(--muted);font-size:12px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}

/* Dialogs */
.scrim{position:absolute;inset:0;background:rgba(10,14,22,.45);display:grid;place-items:center;z-index:20;padding:20px}
.scrim[hidden]{display:none}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(100%,400px);box-shadow:var(--page-shadow);max-height:100%;overflow:auto}
.dlg.wide{width:min(100%,560px)}
.dlg h2{margin:0 0 6px;font-size:17px;font-weight:600}
.dlg p{margin:0 0 14px;color:var(--muted)}
.dlg input[type=password],.dlg input[type=text]{width:100%;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:0 10px}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.dlg .row .left{margin-right:auto;display:flex;gap:8px;align-items:center}
.dlg .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}
.props{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.props dt{color:var(--muted);margin:0}
.props dd{margin:0;overflow-wrap:anywhere}
.sigtabs{display:flex;gap:4px;margin-bottom:10px}
.sigtabs button{height:28px;padding:0 12px;border-radius:6px;color:var(--muted);font-weight:500}
.sigtabs button.on{background:var(--accent-soft);color:var(--accent)}
.pad{position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden;touch-action:none}
.pad canvas{display:block;width:100%;height:200px;cursor:crosshair}
.pad .base{position:absolute;left:24px;right:24px;bottom:48px;border-top:1px dashed #b9bfca;pointer-events:none}
.pad .tip{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#8d95a5;font-size:12px;pointer-events:none}
.typed{display:flex;align-items:center;justify-content:center;height:200px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#111;font-family:var(--script);font-size:56px;padding:0 20px;overflow:hidden;white-space:nowrap}
.inkrow{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:13px}
.ink{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.ink.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--panel)}
.saved{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.saved button{height:52px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;position:relative}
.saved button img{height:100%;max-width:140px;object-fit:contain;display:block}
.saved button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.saved .rm{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:11px;line-height:18px;text-align:center;display:none}
.saved button:hover .rm{display:block}
.saved .lbl{width:100%;color:var(--muted);font-size:12px}

.dropover{position:absolute;inset:0;background:var(--accent-soft);opacity:.92;display:grid;place-items:center;font-size:22px;font-family:var(--serif);z-index:30;border:3px dashed var(--accent);pointer-events:none}
.dropover[hidden]{display:none}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:25;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,14,22,.25);z-index:22;font-size:15px;color:#fff}
.busy[hidden]{display:none}

@media (max-width:720px){
  .side{position:absolute;left:0;top:0;bottom:0;z-index:8;box-shadow:var(--page-shadow)}
  .filename{display:none}

/* ---------- helpers ---------- */
function toast(msg, ms){ els.toast.textContent = msg; els.toast.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(()=>els.toast.classList.remove("show"), ms||2600); }
function busy(on, msg){ $("busy").hidden = !on; if(msg) $("busy").textContent = msg; }
function fmtBytes(n){ if(!n) return ""; const u=["B","KB","MB","GB"]; let i=0; while(n>=1024&&i<3){n/=1024;i++} return n.toFixed(i?1:0)+" "+u[i]; }
function pdfDate(s){ if(!s) return ""; const m=/D:(\d{4})(\d{2})?(\d{2})?(\d{2})?(\d{2})?/.exec(s); if(!m) return s; const d=new Date(+m[1],(+m[2]||1)-1,+m[3]||1,+m[4]||0,+m[5]||0); return isNaN(d)?s:d.toLocaleString(); }
function store(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
function load(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function ask(title, body, yes, no){
  return new Promise(res => {
    $("askTitle").textContent = title; $("askBody").textContent = body; $("askYes").textContent = yes; $("askNo").textContent = no;
    const s = $("askScrim"); s.hidden = false; $("askYes").focus();
    const done = v => { s.hidden = true; $("askYes").onclick = $("askNo").onclick = null; res(v); };
    $("askYes").onclick = () => done(true); $("askNo").onclick = () => done(false);
  });
}
function hexToRgb(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbToHex(r,g,b){ return "#"+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join(""); }
function totalRot(d,p){ return ((p.page.rotate||0) + (p.rot||0) + d.rotation) % 360; }
function curVp(d,p){ return p.page.getViewport({ scale:d.scale, rotation: totalRot(d,p) }); }
function baseVp(p){ return p.page.getViewport({ scale:1, rotation: ((p.page.rotate||0) + (p.rot||0)) % 360 }); }
function pageById(d, id){ return d.pages.find(p => p.id===id) || d.allPages.get(id); }
function viewSize(p){ const vp = baseVp(p); return [vp.width, vp.height]; }
function stamp(){ return new Date().toLocaleString(); }

/* ---------- opening ---------- */
async function openFile(file){ const buf = await file.arrayBuffer(); await openData(new Uint8Array(buf), file.name, file.size); }
async function loadPdfjs(data, name, onPassword){
  const task = pdfjsLib.getDocument({ data, cMapUrl: PDFJS_BASE+"cmaps/", cMapPacked:true, standardFontDataUrl: PDFJS_BASE+"standard_fonts/", wasmUrl: PDFJS_BASE+"wasm/" });
  task.onPassword = (update, reason) => askPassword(name, reason === pdfjsLib.PasswordResponses.INCORRECT_PASSWORD).then(pw => { if(pw===null){ task.destroy(); } else { onPassword?.(pw); update(pw); } });
  return task.promise;
}
async function makePage(d, src, index){
  const page = await src.pdf.getPage(index+1);
  const vp = page.getViewport({scale:1, rotation:0});
  const el = document.createElement("div"); el.className = "page loading";
  el.innerHTML = '<canvas></canvas><div class="textLayer"></div><div class="hl-layer"></div><div class="form-layer"></div><svg class="anno" xmlns="http://www.w3.org/2000/svg"></svg><div class="ov-layer"></div>';
  const p = { id: "p"+(nextPageId++), doc:d, src, srcIndex:index, n:0, page, w:vp.width, h:vp.height, rot:0, el, canvas: el.children[0], tl: el.children[1], hl: el.children[2], fl: el.children[3], svg: el.children[4], ov: el.children[5], rendered:false, task:null, tlTask:null, annots:null };
  el._p = p; d.allPages.set(p.id, p);
  return p;
}
async function openData(data, name, size){
  const bytes = data.slice();
  let password = null; let pdf;
  try { pdf = await loadPdfjs(data, name, pw => password = pw); }
  catch(e){ if(!/cancel|destroy/i.test(String(e?.message||e))) toast("Could not open " + name + ": " + (e?.message || "unknown error")); return; }
  const src = { bytes, pdf, name, password, primary:true };
  const doc = { id: nextId++, name, size, src, pdf, numPages: pdf.numPages, pages: [], allPages: new Map(), zoom: "fitw", scale: 1, rotation: 0, scrollTop: 0, pageNum: 1,
                strip: document.createElement("div"), text: new Map(), find: null, edits: [], form: {}, undo: [], redo: [], dirty:false, pagesChanged:false };
  doc.strip.className = "strip"; doc.strip.hidden = true;
  els.viewer.appendChild(doc.strip);
  for(let i=0;i<pdf.numPages;i++){ const p = await makePage(doc, src, i); doc.pages.push(p); doc.strip.appendChild(p.el); }
  renumber(doc);
  docs.push(doc);
  renderTabs();
  show(doc);
  toast("Opened " + name);
}
function renumber(d){ d.pages.forEach((p,i) => { p.n = i+1; p.el.dataset.page = p.n; }); d.numPages = d.pages.length; if(d===cur) els.pageCount.textContent = d.numPages; }

function askPassword(name, wrong){

/* ---------- layout and rendering ---------- */
function effScale(d){

}
function layout(force){

function seg(which){ for(const [k,btn,pane] of [["thumbs","segThumbs","thumbPane"],["outline","segOutline","outlinePane"],["comments","segComments","commentPane"]]){ $(btn).classList.toggle("on", k===which); $(pane).hidden = k!==which; } $("pageops").hidden = which!=="thumbs"; if(which==="thumbs"&&cur) markThumb(cur,cur.pageNum); }

/* page operations */
function pageSnapshot(d){ return { edits: d.edits, order: d.pages.map(p => ({ id:p.id, rot:p.rot })), form: d.form }; }

function updateHistoryButtons(){ $("undoBtn").disabled = !cur || !cur.undo.length; $("redoBtn").disabled = !cur || !cur.redo.length; $("saveBtn").disabled = !cur; $("printBtn").disabled = !cur; }
function applyState(d, state){
  select(null);

  const newPages = state.order.map(o => { const p = d.allPages.get(o.id); p.rot = o.rot||0; return p; }).filter(Boolean);
  const changed = newPages.length!==d.pages.length || newPages.some((p,i) => p!==d.pages[i]) || newPages.some(p => p.rot !== (p._rotShown||0));
  d.pages = newPages;
  d.strip.innerHTML = ""; for(const p of d.pages){ d.strip.appendChild(p.el); p._rotShown = p.rot; }
  renumber(d);
  if(changed) layout(true); else for(const p of d.pages){ placeOverlays(p); layoutAnno(p); }

function redo(){ const d=cur; if(!d||!d.redo.length) return; commitEditing(); d.undo.push(JSON.stringify(pageSnapshot(d))); restore(d, d.redo.pop()); }

function rotateEditsOnPage(d, p, dir, W, H){   // the page's frame turned by dir, so every edit on it turns with it
  const pt = dir===90 ? ([x,y]) => [H - y, x] : ([x,y]) => [y, W - x];
  const rect = ([x,y,w,h]) => { const c = [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].map(pt); const xs=c.map(q=>q[0]), ys=c.map(q=>q[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys)]; };
  for(const e of d.edits){
    if(e.page!==p.id) continue;
    if(e.type==="text"||e.type==="image"){ [e.x,e.y] = pt([e.x,e.y]); e.rot = ((e.rot||0) + dir + 360) % 360; if(e.ox!==undefined){ [e.ox,e.oy] = pt([e.ox,e.oy]); } }
    else if(e.type==="note"){ const [cx,cy] = pt([e.x+11, e.y+11]); e.x = cx-11; e.y = cy-11; }
    else if(e.type==="mark"){ e.rects = e.rects.map(rect); e.rot = ((e.rot||0) + dir + 360) % 360; }

async function deletePages(){

$("opImage").onclick = async () => {
  const d=cur; if(!d) return; const p = pickedPages(d)[0]; if(!p) return;
  if(!(await ensureDownloads())) return;
  busy(true, "Rendering page…");
  try {
    const vp = p.page.getViewport({ scale: 2.5, rotation: ((p.page.rotate||0)+(p.rot||0))%360 });
    const c = document.createElement("canvas"); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await p.page.render({ canvasContext: c.getContext("2d",{alpha:false}), viewport: vp, annotationMode: pdfjsLib.AnnotationMode.ENABLE_FORMS }).promise;
    await drawEditsOnCanvas(d, p, c, 2.5);
    const blob = await new Promise(r => c.toBlob(r, "image/png"));
    const name = d.name.replace(/\.pdf$/i,"") + ` page ${p.n}.png`;
    await downloadsNS.save({ filename: name, data: blob }); toast("Saved " + name);
  } catch(err){ if(err?.code!=="declined") toast("Couldn't save the image: " + (err?.message||err)); }
  finally { busy(false); }
};

/* ---------- text content (find + edit) ---------- */
async function pageText(d, p){
  if(d.text.has(p.id)) return d.text.get(p.id);
  const tc = await p.page.getTextContent();
  const items = []; let str = "";
  for(const it of tc.items){ if(!("str" in it)) continue; items.push({ start: str.length, len: it.str.length, it, style: tc.styles[it.fontName] }); str += it.str; str += it.hasEOL ? "\n" : " "; }
  const res = { str, items }; d.text.set(p.id, res); return res;
}
function openFind(){ els.find.hidden=false; els.findInput.focus(); els.findInput.select(); }
function closeFind(){ els.find.hidden=true; if(cur){ cur.find=null; clearHighlights(cur); } els.findCount.textContent=""; els.viewer.focus(); }
let findSeq = 0;
async function runFind(){
  const d = cur; if(!d) return;
  const q = els.findInput.value.trim().toLowerCase();
  const seq = ++findSeq;
  if(!q){ d.find=null; clearHighlights(d); els.findCount.textContent=""; return; }
  const matches = [];
  for(const p of d.pages){
    const t = await pageText(d, p); if(seq!==findSeq) return;
    const low = t.str.toLowerCase(); let i = low.indexOf(q);
    while(i>=0){ matches.push({ page:p.id, rects: rectsFor(t, i, q.length) }); i = low.indexOf(q, i+q.length); if(matches.length>5000) break; }
  }
  d.find = { q, matches, cur: 0 };
  if(matches.length){ const first = matches.findIndex(m => pageById(d,m.page).n >= d.pageNum); d.find.cur = first<0?0:first; }
  paintHighlights(d); updateFindCount(d);
  if(matches.length) scrollToMatch(d);
}
function itemBox(entry){
  const it = entry.it; const [a,b,,,ox,oy] = it.transform;
  const fs = Math.hypot(a,b) || 1;
  const asc = entry.style?.ascent || 0.8, desc = entry.style?.descent || -0.22;
  if(it.transform[0]===0 && it.transform[3]===0) return [ox, oy - it.width, ox + it.height, oy];
  return [ox, oy + desc*fs, ox + it.width, oy + asc*fs];
}
function rectsFor(t, start, len){
  const rects = []; const end = start+len;
  for(const entry of t.items){
    const {start:s, len:l} = entry; const e = s+l; if(e<=start || s>=end || !l) continue;
    const a = Math.max(start,s)-s, b = Math.min(end,e)-s;
    const [x1,y1,x2,y2] = itemBox(entry); const w = x2-x1;
    rects.push([x1 + w*(a/l), y1, x1 + w*(b/l), y2]);
  }
  return rects;
}
function clearHighlights(d){ for(const p of d.pages) p.hl.innerHTML=""; }
function paintHighlights(d){
  clearHighlights(d); if(!d.find) return;
  d.find.matches.forEach((m, idx) => {
    const p = pageById(d, m.page); if(!p || !d.pages.includes(p)) return; const vp = curVp(d,p);
    for(const r of m.rects){
      const [x1,y1,x2,y2] = vp.convertToViewportRectangle(r);
      const el = document.createElement("div"); if(idx===d.find.cur) el.className="cur";
      el.style.left = Math.min(x1,x2)+"px"; el.style.top = Math.min(y1,y2)+"px"; el.style.width = Math.abs(x2-x1)+"px"; el.style.height = Math.abs(y2-y1)+"px";
      p.hl.appendChild(el);
    }
  });
}
function updateFindCount(d){ const f=d.find; els.findCount.textContent = !f ? "" : f.matches.length ? `${f.cur+1} of ${f.matches.length}` : "No matches"; }
function scrollToMatch(d){
  const m = d.find.matches[d.find.cur]; if(!m) return; const p = pageById(d, m.page); if(!p) return;
  const vp = curVp(d,p);
  const [,y1,,y2] = vp.convertToViewportRectangle(m.rects[0]||[0,0,0,0]);
  const y = p.el.offsetTop + Math.min(y1,y2);
  const vt = els.viewer.scrollTop, vb = vt + els.viewer.clientHeight;
  if(y < vt+60 || y > vb-60) els.viewer.scrollTop = y - els.viewer.clientHeight*0.4;
}
function findStep(dir){ const d=cur; if(!d||!d.find||!d.find.matches.length) return; const n=d.find.matches.length; d.find.cur=(d.find.cur+dir+n)%n; paintHighlights(d); updateFindCount(d); scrollToMatch(d); }
let findTimer; els.findInput.addEventListener("input", () => { clearTimeout(findTimer); findTimer=setTimeout(runFind, 180); });
els.findInput.addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); if(cur?.find && cur.find.q===els.findInput.value.trim().toLowerCase()) findStep(e.shiftKey?-1:1); else runFind(); } if(e.key==="Escape"){ e.preventDefault(); closeFind(); } });
$("findNext").onclick = () => findStep(1); $("findPrev").onclick = () => findStep(-1); $("findClose").onclick = closeFind;

/* ---------- form fields ---------- */
async function buildFormLayer(p){
  const d = p.doc;
  if(!p.annots){ try { p.annots = (await p.page.getAnnotations()).filter(a => a.subtype==="Widget" && a.fieldName && !a.hidden && a.fieldType!=="Sig" && !a.pushButton); } catch(e){ p.annots = []; } }
  p.fl.innerHTML = ""; if(!p.annots.length || !p.rendered) return;
  const vp = curVp(d,p);
  for(const a of p.annots){
    const [x1,y1,x2,y2] = vp.convertToViewportRectangle(a.rect);
    const left=Math.min(x1,x2), top=Math.min(y1,y2), w=Math.abs(x2-x1), h=Math.abs(y2-y1);
    let el;
    const key = a.fieldName;
    const stored = d.form[key];
    if(a.fieldType==="Tx"){
      el = document.createElement(a.multiLine ? "textarea" : "input"); if(!a.multiLine) el.type = "text";
      el.value = stored!==undefined ? stored : (a.fieldValue ?? "");
      if(a.maxLen) el.maxLength = a.maxLen;
      const fs = a.defaultAppearanceData?.fontSize || 0; el.style.fontSize = (fs ? fs*d.scale : Math.min(h*0.65, 14*d.scale)) + "px";
      el.style.textAlign = ["left","center","right"][a.textAlignment||0] || "left";
      el.addEventListener("input", () => setFormValue(d, key, el.value));
    } else if(a.checkBox){
      el = document.createElement("input"); el.type = "checkbox";
      const on = stored!==undefined ? stored === (a.exportValue||a.buttonValue||"Yes") : (a.fieldValue && a.fieldValue!=="Off");
      el.checked = !!on; el.dataset.on = a.exportValue || a.buttonValue || "Yes";
      el.addEventListener("change", () => setFormValue(d, key, el.checked ? el.dataset.on : "Off"));
    } else if(a.radioButton){
      el = document.createElement("input"); el.type = "radio"; el.name = "r_"+d.id+"_"+key;
      const val = a.buttonValue || a.exportValue || ""; el.dataset.on = val;
      el.checked = stored!==undefined ? stored===val : (a.fieldValue===val);
      el.addEventListener("change", () => { if(el.checked) setFormValue(d, key, val); });
    } else if(a.fieldType==="Ch"){
      el = document.createElement("select");
      for(const o of a.options||[]){ const opt = new Option(o.displayValue ?? o.exportValue, o.exportValue ?? o.displayValue); el.add(opt); }
      const v = stored!==undefined ? stored : (Array.isArray(a.fieldValue) ? a.fieldValue[0] : a.fieldValue);
      if(v!==undefined && v!==null) el.value = v;
      el.style.fontSize = Math.min(h*0.6, 14*d.scale) + "px";
      el.addEventListener("change", () => setFormValue(d, key, el.value));
    } else continue;
    el.className = "fld"; el.title = a.alternativeText || key; el.id = "f_"+d.id+"_"+p.id+"_"+(a.id||key);
    el.style.left = left+"px"; el.style.top = top+"px"; el.style.width = w+"px"; el.style.height = h+"px";
    if(a.readOnly){ el.disabled = true; el.style.background = "transparent"; el.style.borderColor = "transparent"; }
    el.addEventListener("pointerdown", ev => ev.stopPropagation());
    p.fl.appendChild(el);
  }
}
function syncFormLayer(p){ if(p.rendered) buildFormLayer(p); }
function setFormValue(d, key, value){ if(!d._formBefore) d._formBefore = JSON.stringify(pageSnapshot(d)); d.form[key] = value; d.dirty = true; renderTabs(); clearTimeout(d._formTimer); d._formTimer = setTimeout(() => { pushUndo(d, d._formBefore); d._formBefore = null; updateHistoryButtons(); }, 800); }

/* =====================================================================
   EDITING
   Every change is an "edit" stored in view space: the page as it is normally displayed (its own /Rotate plus any
   rotation applied in the Pages pane), at 100%, in points, y pointing down. Overlays draw the edits on screen;
   pdf-lib bakes them into the file on save.
   ===================================================================== */
function viewToPdf(p, x, y){ return baseVp(p).convertToPdfPoint(x, y); }
function pdfToView(p, x, y){ return baseVp(p).convertToViewportPoint(x, y); }
function screenToView(p, sx, sy){ const [px,py] = curVp(p.doc,p).convertToPdfPoint(sx, sy); return pdfToView(p, px, py); }
function viewToScreen(p, vx, vy){ const [px,py] = viewToPdf(p, vx, vy); return curVp(p.doc,p).convertToViewportPoint(px,py); }
function viewRectToScreen(p, x, y, w, h){
  const pts = [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].map(([a,b]) => viewToScreen(p,a,b));
  const xs = pts.map(q=>q[0]), ys = pts.map(q=>q[1]);
  return { left: Math.min(...xs), top: Math.min(...ys), width: Math.max(...xs)-Math.min(...xs), height: Math.max(...ys)-Math.min(...ys) };
}
function screenDeltaToView(d, dx, dy){ const r = -d.rotation*Math.PI/180; return [ (dx*Math.cos(r) - dy*Math.sin(r))/d.scale, (dx*Math.sin(r) + dy*Math.cos(r))/d.scale ]; }
/* Text and image edits have a frame of their own: (e.x, e.y) is the top-left corner in view space and e.rot
   (0/90/180/270, clockwise on screen) is the direction the text runs. Widths and heights are measured inside that frame. */
function localToView(e, lx, ly){ const r = (e.rot||0)*Math.PI/180; return [ e.x + lx*Math.cos(r) - ly*Math.sin(r), e.y + lx*Math.sin(r) + ly*Math.cos(r) ]; }
function localRectBBox(e, lx, ly, lw, lh){ const pts = [[lx,ly],[lx+lw,ly],[lx,ly+lh],[lx+lw,ly+lh]].map(([a,b]) => localToView(e,a,b)); const xs=pts.map(q=>q[0]), ys=pts.map(q=>q[1]); return { x:Math.min(...xs), y:Math.min(...ys), w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys) }; }
function screenDeltaToLocal(d, e, dx, dy){ const r = -((e.rot||0) + d.rotation)*Math.PI/180; return [ (dx*Math.cos(r) - dy*Math.sin(r))/d.scale, (dx*Math.sin(r) + dy*Math.cos(r))/d.scale ]; }

function setTool(t){
  if(t!=="place") pendingImage = null;
  commitEditing();
  tool = t;
  els.viewer.className = "viewer tool-" + t;
  const shapes = ["rect","ellipse","line","arrow"];
  document.querySelectorAll("#toolbar .tool").forEach(b => b.classList.toggle("on", b.dataset.tool===t || (t==="place" && b.dataset.tool==="sign") || (shapes.includes(t) && b.id==="shapeBtn")));
  if(t!=="select") select(null);
  const hints = { edit:"Click a line of text to change it.", text:"Click where the text should go.", place:"Click where the signature should go.", highlight:"Drag across text to highlight it.", underline:"Drag across text to underline it.", strike:"Drag across text to strike it through.", note:"Click where the note should sit.", pen:"Draw on the page.", redact:"Drag a box over what should be removed.", rect:"Drag to draw.", ellipse:"Drag to draw.", line:"Drag to draw.", arrow:"Drag to draw." };
  if(hints[t]) toast(hints[t], 1800);
}
document.querySelectorAll("#toolbar .tool").forEach(b => b.onclick = ev => {
  if(b.id==="shapeBtn"){ const m = $("shapeMenu"); if(ev.target.closest(".menu")) return; if(m.hidden){ m.hidden=false; m.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.shape===shapeKind)); } else m.hidden = true; return; }
  if(b.dataset.tool==="sign") openSignature(); else setTool(b.dataset.tool);
});
$("shapeMenu").querySelectorAll("button").forEach(b => b.onclick = ev => { ev.stopPropagation(); shapeKind = b.dataset.shape; $("shapeIcon").innerHTML = b.querySelector("svg").innerHTML; $("shapeLabel").textContent = b.textContent; $("shapeMenu").hidden = true; setTool(shapeKind); });
document.addEventListener("pointerdown", ev => { if(!ev.target.closest("#shapeBtn")) $("shapeMenu").hidden = true; }, true);

/* overlays for text, images and notes */
function placeOverlays(p){
  const d = p.doc; const have = new Map([...p.ov.children].map(el => [el._edit?.id, el]));
  const want = d.edits.filter(e => e.page===p.id && (e.type==="text"||e.type==="image"||e.type==="note"));
  for(const [id, el] of have) if(!want.some(e=>e.id===id)) el.remove();
  for(const e of want){ let el = have.get(e.id); if(!el){ el = makeOverlay(p, e); p.ov.appendChild(el); } el._edit = e; styleOverlay(p, el, e); }
}
function makeOverlay(p, e){
  const el = document.createElement("div");
  el._edit = e;
  if(e.type==="note"){
    el.className = "note";
    el.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2z" stroke="rgba(0,0,0,.45)" stroke-width="1"/><path d="M7 7h10M7 11h7" stroke="rgba(0,0,0,.55)" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg><div class="pop"><div class="who"></div><textarea placeholder="Write a note"></textarea></div>';
    const ta = el.querySelector("textarea");
    ta.addEventListener("pointerdown", ev => ev.stopPropagation());
    ta.addEventListener("input", () => { if(!editingBefore) editingBefore = JSON.stringify(pageSnapshot(p.doc)); el._edit.text = ta.value; });
    ta.addEventListener("blur", () => { const before = editingBefore; editingBefore = null; if(before && before!==JSON.stringify(pageSnapshot(p.doc))){ pushUndo(p.doc, before); markDirty(p.doc); buildComments(p.doc); } });
    ta.addEventListener("keydown", ev => { ev.stopPropagation(); if(ev.key==="Escape"){ ta.blur(); el.classList.remove("open"); } });
    el.querySelector(".pop").addEventListener("pointerdown", ev => ev.stopPropagation());
    el.addEventListener("pointerdown", ev => onOverlayDown(ev, p, el, el._edit));
    el.addEventListener("dblclick", ev => { ev.preventDefault(); el.classList.toggle("open"); if(el.classList.contains("open")) ta.focus(); });
    return el;
  }
  el.className = "ov " + (e.type==="text"?"text-ov":"img-ov");
  if(e.type==="text"){
    el.innerHTML = '<div class="cover"></div><div class="box"></div><textarea spellcheck="false" placeholder="Type here"></textarea><div class="hnd"></div>';
    const ta = el.querySelector("textarea");
    ta.addEventListener("input", () => { autosize(p, el, el._edit); });
    ta.addEventListener("focus", () => { el.classList.add("editing"); if(!editingBefore) editingBefore = JSON.stringify(pageSnapshot(p.doc)); });
    ta.addEventListener("blur", () => { el.classList.remove("editing"); commitText(p, el, el._edit); });
    ta.addEventListener("keydown", ev => { if(ev.key==="Escape"){ ev.preventDefault(); ta.blur(); els.viewer.focus(); } ev.stopPropagation(); });
  } else {
    el.innerHTML = '<div class="box"></div><img alt="Signature"><div class="hnd"></div>';
    el.querySelector("img").src = e.png;
  }
  el.addEventListener("pointerdown", ev => onOverlayDown(ev, p, el, el._edit));
  el.addEventListener("dblclick", ev => { if(el._edit.type==="text" && (tool==="select"||tool==="edit")){ ev.preventDefault(); beginEditing(p, el, el._edit); } });
  return el;
}
function styleOverlay(p, el, e){
  const d = p.doc, s = d.scale;
  const [ax,ay] = viewToScreen(p, e.x, e.y);
  el.style.left = ax+"px"; el.style.top = ay+"px";
  el.classList.toggle("sel", selected===e);
  if(e.type==="note"){ el.style.transform = d.rotation ? `rotate(${d.rotation}deg)` : ""; el.querySelector("svg path").setAttribute("fill", e.color); el.querySelector(".who").textContent = e.when || ""; const ta = el.querySelector("textarea"); if(ta.value!==e.text) ta.value = e.text; return; }
  el.style.width = (e.w*s)+"px"; el.style.height = (e.h*s)+"px";
  const rot = ((e.rot||0) + d.rotation) % 360;
  el.style.transform = rot ? `rotate(${rot}deg)` : "";
  if(e.type==="text"){
    const ta = el.querySelector("textarea");
    ta.style.font = `${e.italic?"italic ":""}${e.bold?"bold ":""}${e.size*s}px/${LH} ${FONT_CSS[e.font]}`;
    ta.style.color = e.color;
    ta.style.top = ((e.base - BASE)*e.size*s)+"px";
    if(ta.value!==e.text) ta.value = e.text;
    ta.style.width = Math.max(8, e.w*s + 4)+"px"; ta.style.height = Math.max(e.size*s*LH, (e.text.split("\n").length)*e.size*s*LH)+"px";
    const cv = el.querySelector(".cover");
    if(e.cover){ const c=e.cover; cv.style.display="block"; cv.style.background=c.color; cv.style.left=(c.dx*s)+"px"; cv.style.top=(c.dy*s)+"px"; cv.style.width=(c.w*s)+"px"; cv.style.height=(c.h*s)+"px"; }

function measureText(e){

  const lines = e.text.split("\n"); let w = 0; for(const ln of lines) w = Math.max(w, c.measureText(ln||" ").width);
  return [Math.max(w, e.size*0.6), lines.length*e.size*LH];

function autosize(p, el, e){

let editingBefore = null;
function beginEditing(p, el, e){ if(!editingBefore) editingBefore = JSON.stringify(pageSnapshot(p.doc)); const ta = el.querySelector("textarea"); select(e); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
function commitText(p, el, e){
  const d = p.doc; if(!d.edits.includes(e)) return;
  e.text = el.querySelector("textarea").value;
  const before = editingBefore; editingBefore = null;
  const pointless = (e.text.trim()==="" && !e.cover) || (e.cover && e.text===e.orig && e.x===e.ox && e.y===e.oy);
  if(pointless){ d.edits = d.edits.filter(x=>x!==e); if(selected===e) select(null); placeOverlays(p); if(before && before!==JSON.stringify(pageSnapshot(d))){ pushUndo(d, before); markDirty(d); } return; }
  if(before && before!==JSON.stringify(pageSnapshot(d))){ pushUndo(d, before); markDirty(d); }
}
function commitEditing(){ const ta = document.activeElement; if(ta && ta.tagName==="TEXTAREA" && (ta.closest(".ov")||ta.closest(".note"))) ta.blur(); }

function select(e){

  $("propText").style.display = isText ? "contents" : "none";

  $("propWidth").style.display = vec ? "" : "none";
  $("propOpacity").style.display = (vec||mark) ? "" : "none";
  if(isText){ $("pFont").value=e.font; $("pSize").value=Math.round(e.size*10)/10; $("pBold").classList.toggle("on",!!e.bold); $("pItalic").classList.toggle("on",!!e.italic); }
  if(e.color) $("pColor").value = e.color;

  const hints = { text: e.cover ? "Replacing a line of the original. Drag to move, pull the corner to resize." : "Drag to move, pull the corner to resize, double-click to edit.", image:"Drag to move, pull the corner to resize.", note:"Drag to move. Double-click to open or close the note.", mark:"Drag to move.", ink:"Drag to move.", shape:"Drag to move.", redact:"This area will be blacked out and its contents removed when you save. The whole page becomes a picture." };
  $("propHint").textContent = hints[e.type] || "";
}
function findOverlay(e){ const d = cur; if(!d) return null; const p = pageById(d, e.page); if(!p) return null; return [...p.ov.children].find(el => el._edit===e) || [...p.svg.children].find(el => el._edit===e) || null; }
function changeSelected(fn){ const d=cur, e=selected; if(!d||!e) return; snapshot(d); fn(e); if(e.type==="text"){ const [w,h]=measureText(e); e.w=w; e.h=Math.max(h, e.cover?e.cover.h:0); } refreshEdit(e); markDirty(d); select(e); }
function refreshEdit(e){ const p = pageById(cur, e.page); if(!p) return; if(["text","image","note"].includes(e.type)){ const el = findOverlay(e); if(el) styleOverlay(p, el, e); } else drawAnno(p); }
$("pFont").onchange = () => changeSelected(e => e.font = $("pFont").value);
$("pSize").onchange = () => changeSelected(e => e.size = Math.max(4, Math.min(200, +$("pSize").value||12)));
$("pBold").onclick = () => changeSelected(e => e.bold = !e.bold);
$("pItalic").onclick = () => changeSelected(e => e.italic = !e.italic);
$("pColor").oninput = () => changeSelected(e => { e.color = $("pColor").value; if(e.type==="mark"||e.type==="ink"||e.type==="shape") DEFAULTS[e.type==="mark"?e.kind:e.type==="ink"?"pen":"shape"].color = e.color; });

/* drag to move, corner handle to resize */
function onOverlayDown(ev, p, el, e){
  if(ev.button!==0) return;
  if(ev.target.tagName==="TEXTAREA") return;
  const d = p.doc;
  if(tool!=="select" && tool!=="edit"){ setTool("select"); }
  ev.preventDefault(); ev.stopPropagation();
  commitEditing(); select(e);
  const resizing = ev.target.classList.contains("hnd");
  const start = { x: ev.clientX, y: ev.clientY, ex: e.x, ey: e.y, ew: e.w, eh: e.h, size: e.size };
  let moved = false; const before = JSON.stringify(pageSnapshot(d));
  const move = mv => {
    if(!moved && Math.hypot(mv.clientX-start.x, mv.clientY-start.y) < 3) return;
    moved = true; el.classList.add("dragging");

      const [dx] = screenDeltaToLocal(d, e, mv.clientX-start.x, mv.clientY-start.y);
      if(e.type==="image"){ const k = Math.max(0.1, (start.ew + dx)/start.ew); e.w = start.ew*k; e.h = start.eh*k; }

    }
    styleOverlay(p, el, e);

    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
    el.classList.remove("dragging");
    if(moved){ pushUndo(d, before); markDirty(d); buildComments(d); }

  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);

/* ---------- vector annotations: marks, ink, shapes, redactions (one SVG per page, in view space) ---------- */

function drawAnno(p){

}
function mk(tag, attrs){ const el = document.createElementNS(SVGNS, tag); for(const k in attrs) el.setAttribute(k, attrs[k]); return el; }

      else { const [bx,by,bw,bh] = markBand(e, r); g.appendChild(mk("rect", { x:bx, y:by, width:bw, height:bh, fill:e.color })); }
      g.appendChild(mk("rect", { x, y, width:w, height:h, class:"hitf" }));

    if(e.kind==="rect"||e.kind==="ellipse") g.appendChild(mk("rect", { x, y, width:w, height:h, class:"hit", "stroke-width":Math.max(10,e.width+8) }));
    else g.appendChild(mk("line", { x1:e.x1, y1:e.y1, x2:e.x2, y2:e.y2, class:"hit", "stroke-width":Math.max(12,e.width+8) }));

function markBand(e, [x,y,w,h]){   // the underline or strike-through strip of one rect, following the text direction

function onAnnoDown(ev, p, g, e){
  if(ev.button!==0 || tool!=="select") return;
  ev.preventDefault(); ev.stopPropagation(); commitEditing(); select(e);
  const d = p.doc; const start = { x: ev.clientX, y: ev.clientY, snap: JSON.stringify(e) }; const before = JSON.stringify(pageSnapshot(d)); let moved=false;
  const move = mv => {
    if(!moved && Math.hypot(mv.clientX-start.x, mv.clientY-start.y) < 3) return; moved = true;
    const [dx,dy] = screenDeltaToView(d, mv.clientX-start.x, mv.clientY-start.y); const o = JSON.parse(start.snap);
    if(e.type==="mark") e.rects = o.rects.map(([x,y,w,h]) => [x+dx,y+dy,w,h]);

/* drawing with the pen, shape and redact tools */
let draw = null;
function pagePoint(p, ev){ const r = p.el.getBoundingClientRect(); return screenToView(p, ev.clientX - r.left, ev.clientY - r.top); }
function startDraw(p, ev){
  const d = p.doc; const [x,y] = pagePoint(p, ev);
  if(tool==="pen") draw = { p, type:"ink", points:[[x,y]] };
  else if(tool==="redact") draw = { p, type:"redact", x1:x, y1:y, x2:x, y2:y };
  else draw = { p, type:"shape", kind: tool, x1:x, y1:y, x2:x, y2:y };
  draw.live = mk("g", { class:"live" }); p.svg.appendChild(draw.live);
  p.el.setPointerCapture?.(ev.pointerId);
  updateDraw(ev);
}
function updateDraw(ev){
  const dr = draw; if(!dr) return; const [x,y] = pagePoint(dr.p, ev);
  if(dr.type==="ink"){ const l = dr.points[dr.points.length-1]; if(Math.hypot(x-l[0], y-l[1]) > 0.7) dr.points.push([x,y]); }
  else { dr.x2 = x; dr.y2 = y; if(ev.shiftKey && dr.type==="shape" && (dr.kind==="line"||dr.kind==="arrow")){ const ang = Math.round(Math.atan2(y-dr.y1, x-dr.x1)/(Math.PI/4))*(Math.PI/4); const L = Math.hypot(x-dr.x1, y-dr.y1); dr.x2 = dr.x1 + L*Math.cos(ang); dr.y2 = dr.y1 + L*Math.sin(ang); } }
  dr.live.innerHTML = ""; const e = drawToEdit(dr); const g = annoEl(e); if(g) dr.live.appendChild(g);
}
function drawToEdit(dr){
  if(dr.type==="ink") return { id:0, type:"ink", page:dr.p.id, points:dr.points, color:DEFAULTS.pen.color, width:DEFAULTS.pen.width, opacity:1 };
  if(dr.type==="redact") return { id:0, type:"redact", page:dr.p.id, x:Math.min(dr.x1,dr.x2), y:Math.min(dr.y1,dr.y2), w:Math.abs(dr.x2-dr.x1), h:Math.abs(dr.y2-dr.y1) };
  return { id:0, type:"shape", kind:dr.kind, page:dr.p.id, x1:dr.x1, y1:dr.y1, x2:dr.x2, y2:dr.y2, color:DEFAULTS.shape.color, width:DEFAULTS.shape.width, opacity:1 };
}
function endDraw(){
  const dr = draw; if(!dr) return; draw = null; dr.live.remove();
  const d = dr.p.doc; const e = drawToEdit(dr); e.id = nextEditId++;
  const tiny = dr.type==="ink" ? dr.points.length<2 : (Math.abs(dr.x2-dr.x1) < 3 && Math.abs(dr.y2-dr.y1) < 3);
  if(tiny) return;
  snapshot(d); d.edits.push(e); drawAnno(dr.p); markDirty(d);
  if(dr.type==="redact"){ setTool("select"); select(e); }
}
els.viewer.addEventListener("pointermove", ev => { if(draw) updateDraw(ev); });
window.addEventListener("pointerup", () => { if(draw) endDraw(); });
window.addEventListener("pointercancel", () => { if(draw) endDraw(); });

/* text marks from a selection */
function markFromSelection(kind){
  const d = cur; const sel = window.getSelection(); if(!d || !sel || sel.isCollapsed || !sel.rangeCount) return false;
  const byPage = new Map();
  for(let i=0;i<sel.rangeCount;i++){
    const range = sel.getRangeAt(i);
    const rects = [...range.getClientRects()];
    for(const r of rects){
      if(r.width < 1 || r.height < 1) continue;
      const el = document.elementFromPoint(r.left + Math.min(2, r.width/2), r.top + r.height/2); const pageEl = el?.closest?.(".page"); if(!pageEl) continue; const p = pageEl._p;
      const pr = pageEl.getBoundingClientRect();
      const corners = [[r.left-pr.left, r.top-pr.top],[r.right-pr.left, r.top-pr.top],[r.left-pr.left, r.bottom-pr.top],[r.right-pr.left, r.bottom-pr.top]].map(([sx,sy]) => screenToView(p, sx, sy));
      const xs = corners.map(c=>c[0]), ys = corners.map(c=>c[1]);
      const box = [Math.min(...xs), Math.min(...ys), Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys)];
      if(!byPage.has(p)) byPage.set(p, []); byPage.get(p).push(box);
    }
  }
  if(!byPage.size) return false;
  snapshot(d);
  for(const [p, boxes] of byPage){
    // merge boxes on the same line
    boxes.sort((a,b) => a[1]-b[1] || a[0]-b[0]); const merged = [];
    for(const b of boxes){ const m = merged[merged.length-1]; if(m && Math.abs(m[1]-b[1]) < b[3]*0.5 && b[0] <= m[0]+m[2]+2){ const x2 = Math.max(m[0]+m[2], b[0]+b[2]); m[0] = Math.min(m[0], b[0]); m[2] = x2-m[0]; m[1] = Math.min(m[1], b[1]); m[3] = Math.max(m[3], b[3]); } else merged.push([...b]); }
    const e = { id: nextEditId++, type:"mark", kind, page:p.id, rects: merged, rot: ((p.page.rotate||0)+(p.rot||0))%360, color: DEFAULTS[kind].color, opacity: 1 };
    d.edits.push(e); drawAnno(p);
  }
  markDirty(d); sel.removeAllRanges();
  return true;
}
document.addEventListener("mouseup", () => { if(["highlight","underline","strike"].includes(tool)) setTimeout(() => markFromSelection(tool), 10); });

/* clicks on the page for the Text, Edit, Note, Place and drawing tools */
els.viewer.addEventListener("pointerdown", async ev => {
  if(ev.button!==0) return;
  const pageEl = ev.target.closest?.(".page");
  if(ev.target.closest?.(".ov,.note,.form-layer,.anno .a")) return;
  if(!pageEl){ if(tool==="select") { commitEditing(); select(null); } return; }
  const p = pageEl._p, d = p.doc; const r = pageEl.getBoundingClientRect();
  const [vx, vy] = screenToView(p, ev.clientX - r.left, ev.clientY - r.top);
  if(tool==="select"){ commitEditing(); select(null); return; }
  if(["highlight","underline","strike"].includes(tool)) return;   // the text layer handles the drag
  ev.preventDefault();
  if(["pen","rect","ellipse","line","arrow","redact"].includes(tool)){ startDraw(p, ev); return; }
  if(tool==="text"){
    setTool("select");
    const before = JSON.stringify(pageSnapshot(d));
    const e = { id: nextEditId++, type:"text", page:p.id, x:vx, y:vy - 12*BASE, w:8, h:12*LH, rot:0, text:"", size:12, font:"sans", bold:false, italic:false, color:"#111111", base:BASE, cover:null };
    d.edits.push(e); placeOverlays(p);
    editingBefore = before; beginEditing(p, findOverlay(e), e);
  } else if(tool==="note"){
    snapshot(d);
    const e = { id: nextEditId++, type:"note", page:p.id, x:vx-2, y:vy-2, text:"", color: DEFAULTS.note.color, when: stamp() };
    d.edits.push(e); placeOverlays(p); markDirty(d); setTool("select"); select(e);
    const el = findOverlay(e); el.classList.add("open"); el.querySelector("textarea").focus(); buildComments(d);
  } else if(tool==="edit"){
    const t = await pageText(d, p);
    const hit = hitText(p, t, vx, vy);
    if(!hit){ toast("No text there. Click directly on a line of text.", 2200); return; }
    startEditExisting(p, t, hit, vx, vy);
  } else if(tool==="place" && pendingImage){
    const img = pendingImage; snapshot(d);
    const w = Math.min(170, p.w*0.4), h = w*img.h/img.w;
    const e = { id: nextEditId++, type:"image", page:p.id, x:vx - w/2, y:vy - h/2, w, h, rot:0, png: img.src };
    d.edits.push(e); placeOverlays(p); markDirty(d); setTool("select"); select(e);
  }
});
function hitText(p, t, vx, vy){
  const [px,py] = viewToPdf(p, vx, vy);
  for(const entry of t.items){
    if(!entry.it.str.trim()) continue;
    const [x1,y1,x2,y2] = itemBox(entry);
    if(px>=x1-1 && px<=x2+1 && py>=y1-1 && py<=y2+1) return entry;
  }
  return null;
}
function sampleColors(p, box){

  const k = DPR; const x = Math.max(0, Math.floor(r.left*k)), y = Math.max(0, Math.floor(r.top*k)), w = Math.min(p.canvas.width-x, Math.ceil(r.width*k)), h = Math.min(p.canvas.height-y, Math.ceil(r.height*k));

  for(let i=0;i<w;i++){ for(const j of [0,h-1]){ const idx=(j*w+i)*4; count.set(key(idx),(count.get(key(idx))||0)+1); } }
  for(let j=0;j<h;j++){ for(const i of [0,w-1]){ const idx=(j*w+i)*4; count.set(key(idx),(count.get(key(idx))||0)+1); } }
  let bgKey = 0xfff, bgN = -1; for(const [kk,n] of count) if(n>bgN){ bgN=n; bgKey=kk; }
  const bg = [((bgKey>>8)&15)*17, ((bgKey>>4)&15)*17, (bgKey&15)*17];
  const tc = new Map(); let sum = new Map();
  for(let i=0;i<data.length;i+=4){ const dr=data[i]-bg[0], dg=data[i+1]-bg[1], db=data[i+2]-bg[2]; if(dr*dr+dg*dg+db*db < 90*90) continue; const kk = key(i); tc.set(kk,(tc.get(kk)||0)+1); const s = sum.get(kk)||[0,0,0]; s[0]+=data[i]; s[1]+=data[i+1]; s[2]+=data[i+2]; sum.set(kk,s); }

}
function fontFromName(p, fontName){
  let name = "", bold=false, italic=false, serif=false, mono=false;
  try { const f = p.page.commonObjs.get(fontName); name = f?.name || ""; bold = !!f?.bold; italic = !!f?.italic; serif = !!f?.isSerifFont; mono = !!f?.isMonospace; } catch(e){}
  const n = name.toLowerCase();

  else if(/times|georgia|garamond|serif|book|roman|cambria|minion|palatino/.test(n) && !/sans/.test(n)) serif = true;

}
function startEditExisting(p, t, entry, vx, vy){

/* ---------- signature pad ---------- */

async function drawEditsOnCanvas(d, p, c, k){   // k = canvas pixels per view-space point
  const ctx = c.getContext("2d");
  const imgs = new Map();
  for(const e of d.edits){ if(e.page===p.id && e.type==="image"){ const img = new Image(); img.src = e.png; await img.decode().catch(()=>{}); imgs.set(e, img); } }
  for(const e of d.edits){
    if(e.page!==p.id) continue;
    ctx.save(); ctx.globalAlpha = e.opacity ?? 1;
    if(e.type==="mark"){ ctx.fillStyle = e.color; if(e.kind==="highlight") ctx.globalCompositeOperation = "multiply"; for(const r of e.rects){ const [x,y,w,h] = e.kind==="highlight" ? r : markBand(e, r); ctx.fillRect(x*k,y*k,w*k,h*k); } }

    else if(e.type==="shape"){ ctx.strokeStyle = e.color; ctx.lineWidth = e.width*k; ctx.lineCap="round"; const x=Math.min(e.x1,e.x2)*k, y=Math.min(e.y1,e.y2)*k, w=Math.abs(e.x2-e.x1)*k, h=Math.abs(e.y2-e.y1)*k;
      if(e.kind==="rect") ctx.strokeRect(x,y,w,h); else if(e.kind==="ellipse"){ ctx.beginPath(); ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2); ctx.stroke(); } else { ctx.beginPath(); ctx.moveTo(e.x1*k,e.y1*k); ctx.lineTo(e.x2*k,e.y2*k); ctx.stroke(); if(e.kind==="arrow") for(const [ax,ay,bx,by] of arrowHead(e)){ ctx.beginPath(); ctx.moveTo(ax*k,ay*k); ctx.lineTo(bx*k,by*k); ctx.stroke(); } } }

    ctx.restore();

}

async function drawFormValues(d, p, ctx, vp){   // the filled-in fields, painted onto a rasterised page
  if(!p.annots){ try { p.annots = (await p.page.getAnnotations()).filter(a => a.subtype==="Widget" && a.fieldName && !a.hidden && a.fieldType!=="Sig" && !a.pushButton); } catch(e){ p.annots = []; } }
  for(const a of p.annots){
    const [x1,y1,x2,y2] = vp.convertToViewportRectangle(a.rect); const x=Math.min(x1,x2), y=Math.min(y1,y2), w=Math.abs(x2-x1), h=Math.abs(y2-y1);

    ctx.save(); ctx.strokeStyle = "#9aa3b2"; ctx.lineWidth = 1; ctx.fillStyle = "#111";
    if(a.checkBox || a.radioButton){
      const on = a.checkBox ? (v && v!=="Off") : (v === (a.buttonValue||a.exportValue));
      if(a.radioButton){ ctx.beginPath(); ctx.arc(x+w/2, y+h/2, Math.min(w,h)/2-1, 0, Math.PI*2); ctx.stroke(); if(on){ ctx.beginPath(); ctx.arc(x+w/2, y+h/2, Math.min(w,h)/4, 0, Math.PI*2); ctx.fill(); } }

    } else {

async function ensureDownloads(){ if(downloadsNS===undefined) await new Promise(r=>setTimeout(r,800)); if(!downloadsNS){ toast("Saving isn't available in this view.", 3000); return false; } return true; }

      } catch(err){ console.warn("edit", e, err); }
    }
  }

}
async function printDoc(){
  const d = cur; if(!d || !DESKTOP) return;
  commitEditing();
  $("printBtn").disabled = true; busy(true, "Preparing to print…");
  try {
    const pages = [];
    for(const p of d.pages){
      const vp = p.page.getViewport({ scale: 2, rotation: ((p.page.rotate||0)+(p.rot||0))%360 });
      const c = document.createElement("canvas"); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      await p.page.render({ canvasContext: c.getContext("2d",{alpha:false}), viewport: vp, annotationMode: pdfjsLib.AnnotationMode.ENABLE_FORMS }).promise;
      await drawEditsOnCanvas(d, p, c, 2);
      pages.push({ src: c.toDataURL("image/jpeg", 0.92), wpt: vp.width/2, hpt: vp.height/2 });
      busy(true, `Preparing to print… page ${pages.length} of ${d.pages.length}`);
    }
    const r = await window.eboda.print({ title: d.name, pages });
    if(r?.error) toast("Couldn't print: " + r.error, 4000);
  } catch(err){ console.error(err); toast("Couldn't print: " + (err?.message||err), 4000); }
  finally { $("printBtn").disabled = !cur; busy(false); }
}
async function saveCopy(opts){
  const d = cur; if(!d) return;
  commitEditing();
  if(d.src.password){ toast("Saving password-protected files isn't supported yet. Remove the password first.", 4000); return; }
  if(!(await ensureDownloads())) return;
  $("saveBtn").disabled = true; busy(true, "Building your PDF…");
  try {
    const bytes = await buildPdf(d, opts?.only);
    const name = d.name.replace(/\.pdf$/i, "") + (opts?.suffix ?? ((d.dirty || d.edits.length || d.pagesChanged) ? " (edited)" : " (copy)")) + ".pdf";
    await downloadsNS.save({ filename: name, data: new Blob([bytes], { type:"application/pdf" }) });
    if(!opts?.only){ d.dirty = false; renderTabs(); }
    toast("Saved " + name);
  } catch(err){
    if(err?.code==="declined") toast("Save cancelled.");
    else if(err?.code==="rate_limited") toast("A save prompt is already open.");
    else { console.error(err); toast("Couldn't save: " + (err?.message || err), 4000); }
  } finally { $("saveBtn").disabled = !cur; busy(false); }
}
$("saveBtn").onclick = () => saveCopy();

  const rows = [["File", d.name],["Size", fmtBytes(d.size)],["Pages", d.numPages],["Page size", `${pw} x ${ph} mm`],["Title", info.Title],["Author", info.Author],["Subject", info.Subject],["Created", pdfDate(info.CreationDate)],["Modified", pdfDate(info.ModDate)],["Application", info.Creator],["PDF producer", info.Producer],["PDF version", info.PDFFormatVersion]];
  const dl = $("propList"); dl.innerHTML = "";
  for(const [k,v] of rows){ if(v===undefined||v===null||v===""||v==="unspecified"||v==="anonymous"||v==="untitled") continue; const dt=document.createElement("dt"), dd=document.createElement("dd"); dt.textContent=k; dd.textContent=v; dl.append(dt,dd); }
  $("propScrim").hidden = false; $("propClose").focus();
}
$("propClose").onclick = () => { $("propScrim").hidden = true; };
$("propScrim").addEventListener("click", e => { if(e.target===e.currentTarget) e.currentTarget.hidden=true; });

/* ---------- toolbar wiring ---------- */
const pick = () => $("fileInput").click();
$("openBtn").onclick = pick; $("openBtn2").onclick = pick;
$("fileInput").addEventListener("change", async e => { for(const f of e.target.files) await openFile(f); e.target.value=""; });
$("prevBtn").onclick = () => goTo((cur?.pageNum||1)-1);
$("nextBtn").onclick = () => goTo((cur?.pageNum||1)+1);
els.pageInput.addEventListener("keydown", e => { if(e.key==="Enter"){ goTo(+els.pageInput.value); els.viewer.focus(); } });
els.pageInput.addEventListener("blur", () => { if(cur) els.pageInput.value = cur.pageNum; });
$("zoomOut").onclick = () => zoomStep(-1); $("zoomIn").onclick = () => zoomStep(1);
els.zoomSel.addEventListener("change", () => setZoom(els.zoomSel.value));
$("rotBtn").onclick = () => rotateView(90);
function rotateView(deg){ const d=cur; if(!d) return; commitEditing(); d.rotation=(d.rotation+deg+360)%360; layout(true); buildThumbs(d); }
$("undoBtn").onclick = undo; $("redoBtn").onclick = redo;
$("findBtn").onclick = () => els.find.hidden ? openFind() : closeFind();
$("nightBtn").onclick = () => setNight(!night);
function setNight(v){ night=v; els.main.classList.toggle("night", v); $("nightBtn").classList.toggle("on", v); store("eboda.night", v?"1":"0"); }
$("themeBtn").onclick = () => { const r=document.documentElement; const dark = r.dataset.theme==="dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches); r.dataset.theme = dark?"light":"dark"; store("eboda.theme", r.dataset.theme); };
$("propsBtn").onclick = showProps;
$("sideBtn").onclick = () => setSide(els.side.hidden);
function setSide(v){ els.side.hidden=!v; $("sideBtn").classList.toggle("on", v); store("eboda.side", v?"1":"0"); if(v&&cur) markThumb(cur,cur.pageNum); }

els.viewer.addEventListener("wheel", e => { if(!e.ctrlKey && !e.metaKey) return; e.preventDefault(); zoomStep(e.deltaY<0?1:-1); }, { passive:false });

/* keyboard */
document.addEventListener("keydown", e => {
  const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName||"");
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  if(mod && k==="o"){ e.preventDefault(); pick(); return; }
  if(mod && k==="s"){ e.preventDefault(); saveCopy(); return; }
  if(mod && k==="p"){ e.preventDefault(); if(DESKTOP) printDoc(); else toast("Printing is available in the Windows app."); return; }
  if(mod && k==="f"){ e.preventDefault(); openFind(); return; }
  if(mod && k==="b"){ e.preventDefault(); setSide(els.side.hidden); return; }
  if(mod && k==="w" && cur){ e.preventDefault(); closeDoc(cur); return; }
  if(mod && (e.key==="="||e.key==="+")){ e.preventDefault(); zoomStep(1); return; }
  if(mod && e.key==="-"){ e.preventDefault(); zoomStep(-1); return; }
  if(mod && e.key==="0"){ e.preventDefault(); setZoom("fitw"); return; }
  if(mod && e.key==="1"){ e.preventDefault(); setZoom(1); return; }
  if(mod && e.key==="2"){ e.preventDefault(); setZoom("fitp"); return; }
  if(inField && document.activeElement.closest?.(".ov,.note,.form-layer,.dlg,.find")) return;
  if(mod && k==="z"){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
  if(mod && k==="y"){ e.preventDefault(); redo(); return; }
  if(e.key==="Escape"){
    if(!$("sigScrim").hidden) $("sigScrim").hidden = true;
    else if(!$("propScrim").hidden) $("propScrim").hidden=true;
    else if(!$("askScrim").hidden) { }
    else if(!els.find.hidden) closeFind();
    else if(selected) select(null);
    else if(tool!=="select") setTool("select");
    else if(picked.size){ picked.clear(); paintPicked(); }
    return;
  }
  if(inField || mod || e.altKey) return;
  if((e.key==="Delete"||e.key==="Backspace") && selected){ e.preventDefault(); deleteSelected(); }
  else if(k==="v") setTool("select");
  else if(k==="t" && cur) setTool("text");
  else if(k==="e" && cur) setTool("edit");
  else if(k==="s" && cur) openSignature();
  else if(k==="h" && cur) setTool("highlight");
  else if(k==="u" && cur) setTool("underline");
  else if(k==="c" && cur) setTool("note");
  else if(k==="p" && cur) setTool("pen");
  else if(k==="r") rotateView(e.shiftKey?-90:90);
  else if(k==="n") setNight(!night);
  else if(e.key==="Home" && cur){ e.preventDefault(); goTo(1); }
  else if(e.key==="End" && cur){ e.preventDefault(); goTo(cur.numPages); }
});
window.addEventListener("beforeunload", e => { if(docs.some(d=>d.dirty)){ e.preventDefault(); e.returnValue = ""; } });

/* drag and drop */
let dragDepth=0;
window.addEventListener("dragenter", e => { if([...e.dataTransfer?.types||[]].includes("Files")){ dragDepth++; $("dropover").hidden=false; } });
window.addEventListener("dragleave", () => { if(--dragDepth<=0){ dragDepth=0; $("dropover").hidden=true; } });
window.addEventListener("dragover", e => { if([...e.dataTransfer?.types||[]].includes("Files")) e.preventDefault(); });
window.addEventListener("drop", async e => { if(![...e.dataTransfer?.types||[]].includes("Files")) return; e.preventDefault(); dragDepth=0; $("dropover").hidden=true;
  const files = [...e.dataTransfer.files].filter(f => /\.pdf$/i.test(f.name) || f.type==="application/pdf");
  if(!files.length){ toast("Only PDF files can be opened here."); return; }
  for(const f of files) await openFile(f);
});

/* restore prefs and open the tour */
(function init(){
  const th = load("eboda.theme"); if(th==="dark"||th==="light") document.documentElement.dataset.theme = th;
  if(load("eboda.night")==="1") setNight(true);
  if(load("eboda.side")==="0") setSide(false); else $("sideBtn").classList.add("on");
  renderTabs();
  const openWelcome = () => { const bin = atob(SAMPLE_B64); const u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); openData(u8, "Welcome to Eboda.pdf", u8.length); };
  if(DESKTOP){
    $("printBtn").hidden = false; $("printBtn").onclick = printDoc;
    const openFromDesk = f => openData(new Uint8Array(f.bytes), f.name, f.bytes.byteLength);
    window.eboda.onOpenFile(openFromDesk);   // files double-clicked in Explorer while Eboda is running
    window.eboda.getLaunchFiles().then(files => { if(files.length) files.forEach(openFromDesk); else if(!load("eboda.seenTour")){ openWelcome(); store("eboda.seenTour","1"); } });
  } else openWelcome();
})();
</script>
